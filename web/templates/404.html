{{template "head" .}}
<body>
{{template "header" .}}
<main id="main" class="wrap prose center-block page-404">
  <div class="glass-container error-card-container">
    <div class="error-badge">404</div>
    <h1>Lost in Space</h1>
    <p class="muted">The page you are looking for does not exist or has been moved.</p>
    
    <div class="search-box">
      <input type="text" id="search-404" placeholder="Search for another project..." aria-label="Search repositories">
      <button class="btn btn-primary" onclick="window.location.href='/?q=' + encodeURIComponent(document.getElementById('search-404').value)">Search</button>
    </div>

    <div class="suggestions">
      <h3>Quick Links</h3>
      <div class="links-grid">
        <a href="/" class="btn">🏠 Home</a>
        <a href="/impressum" class="btn">📄 Impressum</a>
        <a href="/datenschutz" class="btn">🔒 Privacy Policy</a>
      </div>
    </div>
  </div>
</main>
{{template "footer" .}}
<script nonce="{{.Nonce}}">
  document.getElementById('search-404').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      window.location.href = '/?q=' + encodeURIComponent(this.value);
    }
  });
</script>
</body>
</html>
