name: Go Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Application
        run: CGO_ENABLED=0 go build -v -o gitindex .
