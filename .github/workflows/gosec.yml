name: Go Security Scan (gosec)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  gosec:
    name: Run gosec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: Run Gosec
        uses: securego/gosec@71577268350e1e0f2f1491de1ef53f1227b43c1f # Go 1.27.2 support
        env:
          # The gosec image bundles an older Go (1.26.2) with GOTOOLCHAIN=local;
          # allow it to fetch the toolchain go.mod requires (>= 1.26.4).
          GOTOOLCHAIN: auto
        with:
          args: ./...
