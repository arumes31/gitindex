name: Go Vulnerability Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 12 * * 1'

jobs:
  vulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.4'
          go-package: ./...
