name: Go Linter (golangci-lint)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          # Build golangci-lint from source with the Go above (1.26.5) so its
          # build version is >= the module's targeted Go version. The prebuilt
          # binaries are compiled with an older Go and would be rejected.
          install-mode: goinstall
