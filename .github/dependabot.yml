version: 2
updates:
  # ---- Go modules ----
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "build(deps)"
    groups:
      # Bundle non-major updates into a single PR to reduce noise.
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions used by the workflows ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-all:
        update-types:
          - "minor"
          - "patch"

  # ---- Dockerfile base images ----
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
